name: skynet
services:
  develop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DISPLAY_BANNER: ${DISPLAY_BANNER:-false}
        ROOT_PASSWORD: ${ROOT_PASSWORD:-}
    image: skynet:latest
    container_name: skynet
    hostname: sandbox
    working_dir: ${WORKSPACE_TARGET}
    stdin_open: true
    tty: true

    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor

    volumes:
      # Mount helper scripts (e.g. run: sudo bash /scripts/fix-perms.sh <path>)
      - ./scripts:/scripts:ro
      - ${WORKSPACE_SOURCE}:${WORKSPACE_TARGET}

    restart: "unless-stopped"
